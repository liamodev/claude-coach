# profile.yaml — Your Context & History
#
# This file builds over time. Updated after coaching sessions
# as new context is shared. All entries dated for temporal context.
#
# Purpose: Give future Claude instances enough background to coach
# effectively without starting from zero.
#
# SETUP: Fill in the identity and company sections before your first session.
# Everything else builds naturally through coaching conversations.

last_updated: ""

identity:
  name: ""
  location: ""
  timezone: ""              # e.g. America/Los_Angeles, America/New_York

company:
  name: ""
  what_we_do: ""
  stage: ""                 # e.g. idea, pre-revenue, early-stage, scaling
  founded: ""

self_concept:
  current: ""              # How they see themselves now — their current identity
  emerging: ""             # Who they are becoming — "I am the kind of person who..."
  as_of: ""
  # coaching_contract: ""  # How they want to be challenged; what to never let them off the hook for

values:
  core: []                 # e.g. [integrity, autonomy, impact, growth, family]
  as_of: ""
  notes: ""                # What these values mean to them in practice

beliefs:
  limiting:
    # Format: { belief: "...", first_noted: "YYYY-MM-DD", status: "active/shifting/resolved" }
    # e.g. { belief: "I'm not ready to lead a team yet", first_noted: "2026-01-01", status: "active" }
  empowering:
    # Format: { belief: "...", first_noted: "YYYY-MM-DD" }
    # e.g. { belief: "I figure things out when I commit fully", first_noted: "2026-01-01" }

background:
  entries:
    # Add professional history, career highlights, relevant context
    # Format: { note: "...", date: "YYYY-MM-DD" }

patterns:
  strengths:
    # Format: { observation: "...", first_noted: "YYYY-MM-DD", recurrence_count: 1 }
  blind_spots:
    # Format: { observation: "...", first_noted: "YYYY-MM-DD", recurrence_count: 1 }
  recurring_themes:
    # What keeps surfacing across sessions — deeper than individual strengths/blind spots
    # Format: { theme: "...", first_noted: "YYYY-MM-DD", sessions_count: 1 }

wiring:
  # Optional: personality assessments (CliftonStrengths, DISC, Dalio, etc.)
  # source: ""
  # archetype: ""
  # top_strengths: []
  # key_gaps: []
  # coaching_implications: []

energy:
  energizers: []           # What gives energy and momentum
  drains: []               # What depletes energy
