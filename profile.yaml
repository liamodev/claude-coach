    - "Analytical (#3) — searches for reasons and causes, thinks through all factors. Treats problems like systems."
    - "Focus (#4) — prioritizes and follows through. Needs clear goals or drifts."
    - "Discipline (#5) — creates order, structure, routine. Systems are natural."
    - "Significance (#6) — needs work that matters. Mediocrity is demotivating."
